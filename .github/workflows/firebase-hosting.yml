name: Deploy to Firebase Hosting (OIDC)

on:
  push:
    branches: [prod]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Verify GCP_PROJECT_NUMBER secret exists
        run: |
          if [ -z "${{ secrets.GCP_PROJECT_NUMBER }}" ]; then
            echo "::error::Secret GCP_PROJECT_NUMBER is NOT set."
            exit 1
          fi
          echo "GCP_PROJECT_NUMBER looks set."

      - name: Auth to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider-2
          service_account: firebase-github-deploy@bright-edu-data.iam.gserviceaccount.com

      - name: Print provider path (sanity)
        run: |
          echo "WIF: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider-2"

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Validate Firebase env
        env:
          VITE_API_KEY: ${{ vars.VITE_API_KEY }}
          VITE_AUTH_DOMAIN: ${{ vars.VITE_AUTH_DOMAIN }}
          VITE_PROJECT_ID: ${{ vars.VITE_PROJECT_ID }}
          VITE_STORAGE_BUCKET: ${{ vars.VITE_STORAGE_BUCKET }}
          VITE_MESSAGING_SENDER_ID: ${{ vars.VITE_MESSAGING_SENDER_ID }}
          VITE_APP_ID: ${{ vars.VITE_APP_ID }}
        run: |
          required_vars=(
            "VITE_API_KEY"
            "VITE_AUTH_DOMAIN"
            "VITE_PROJECT_ID"
            "VITE_STORAGE_BUCKET"
            "VITE_MESSAGING_SENDER_ID"
            "VITE_APP_ID"
          )

          missing=0
          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name}" ]; then
              echo "::error::Missing required Firebase variable: ${var_name}"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_API_KEY: ${{ vars.VITE_API_KEY }}
          VITE_AUTH_DOMAIN: ${{ vars.VITE_AUTH_DOMAIN }}
          VITE_PROJECT_ID: ${{ vars.VITE_PROJECT_ID }}
          VITE_STORAGE_BUCKET: ${{ vars.VITE_STORAGE_BUCKET }}
          VITE_MESSAGING_SENDER_ID: ${{ vars.VITE_MESSAGING_SENDER_ID }}
          VITE_APP_ID: ${{ vars.VITE_APP_ID }}
          VITE_MEASUREMENT_ID: ${{ vars.VITE_MEASUREMENT_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}
          VITE_SYNC_API_KEY: ${{ vars.VITE_SYNC_API_KEY }}
          VITE_SYNC_SERVICE_URL: ${{ vars.VITE_SYNC_SERVICE_URL }}
          VITE_DEV_SYNC_SERVICE_URL: ${{ vars.VITE_DEV_SYNC_SERVICE_URL }}
          VITE_USE_FIREBASE_EMULATOR: "false"
        run: npm run build:prod

      - name: Firebase whoami (optional debug)
        run: |
          npx firebase-tools --version
          npx firebase-tools projects:list --json || true

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project bright-edu-data
