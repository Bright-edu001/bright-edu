name: Deploy PR to Firebase Hosting (Preview)

on:
  pull_request:
    branches: [prod, main, master]

jobs:
  build_and_preview:
    if: "${{ github.event.pull_request.head.repo.full_name == github.repository }}"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build:prod

      - name: Auth to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider-2
          service_account: firebase-github-deploy@bright-edu-data.iam.gserviceaccount.com

      - name: Deploy to Firebase Hosting (Preview)
        id: deploy_preview
        run: |
          DEPLOY_OUTPUT=$(npx firebase-tools hosting:channel:deploy pr-${{ github.event.number }} --expires 7d --project bright-edu-data --json)
          PREVIEW_URL=$(echo $DEPLOY_OUTPUT | jq -r '.result."bright-edu-data".url')
          echo "url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "✅ Deployed to: $PREVIEW_URL"

      - name: Comment PR with Preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy_preview.outputs.url }}
        with:
          script: |
            // 尋找是否已經有我們機器人留過的訊息，避免重複留言
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes('Firebase 預覽版部署成功')
            );

            const previewUrl = process.env.PREVIEW_URL;
            const commentBody = '🚀 **Firebase 預覽版部署成功！**\n\n' +
                                '🔍 **預覽網址 (Preview URL):** ' + previewUrl + '\n\n' +
                                '_(此連結將保留 7 天)_';

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }
