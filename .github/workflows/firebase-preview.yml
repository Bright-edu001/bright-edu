name: Deploy PR to Firebase Hosting (Preview)

on:
  pull_request:
    branches: [prod, main, master]

jobs:
  build_and_preview:
    if: "${{ github.event.pull_request.head.repo.full_name == github.repository }}"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build:prod

      # 注意：如果此步驟失敗，請檢查 GCP WIF 的 Attribute Condition 是否限制了分支
      # 報錯：The given credential is rejected by the attribute condition
      # 修復：需在 GCP Console 修改 Workload Identity Pool Provider 的條件，允許 PR 分支 (assertion.ref_type == 'branch')
      - name: Auth to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider-2
          service_account: firebase-github-deploy@bright-edu-data.iam.gserviceaccount.com

      - name: Deploy to Firebase Hosting (Preview)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: ""
          projectId: bright-edu-data
          channelId: pr-${{ github.event.number }}
          expires: 7d
        env:
          FIREBASE_CLI_PREFLIGHT_WIF: "true" # 強制要求 CLI 使用 WIF 認證環境變數
