name: Deploy PR to Firebase Hosting (Preview)

on:
  pull_request:
    branches: [prod, main, master]

jobs:
  build_and_preview:
    if: "${{ github.event.pull_request.head.repo.full_name == github.repository }}"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build:prod

      - name: Auth to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider-2
          service_account: firebase-github-deploy@bright-edu-data.iam.gserviceaccount.com

      - name: Deploy to Firebase Hosting (Preview)
        run: |
          npx firebase-tools hosting:channel:deploy pr-${{ github.event.number }} --expires 7d --project bright-edu-data